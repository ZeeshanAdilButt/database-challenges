<svg xmlns="http://www.w3.org/2000/svg" width="792" height="366" viewBox="0 0 792 366" font-family="Arial, sans-serif" font-size="12">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="12" y="26" font-size="16" font-weight="bold" fill="#111">After a restart: is anything still stuck as running?</text>
<line x1="60" y1="270" x2="782" y2="270" stroke="#888"/>
<text x="12" y="60" fill="#555">tasks</text>
<rect x="70" y="50" width="56" height="220" fill="#c0392b"/>
<text x="98" y="44" text-anchor="middle" fill="#111">1</text>
<rect x="134" y="270" width="56" height="1" fill="#1f7a4d"/>
<text x="162" y="264" text-anchor="middle" fill="#111">0</text>
<text x="130" y="288" text-anchor="middle" font-weight="bold" fill="#111">sqlite, no recovery</text>
<rect x="248" y="270" width="56" height="1" fill="#c0392b"/>
<text x="276" y="264" text-anchor="middle" fill="#111">0</text>
<rect x="312" y="50" width="56" height="220" fill="#1f7a4d"/>
<text x="340" y="44" text-anchor="middle" fill="#111">1</text>
<text x="308" y="288" text-anchor="middle" font-weight="bold" fill="#111">sqlite, with recovery</text>
<rect x="426" y="50" width="56" height="220" fill="#c0392b"/>
<text x="454" y="44" text-anchor="middle" fill="#111">1</text>
<rect x="490" y="270" width="56" height="1" fill="#1f7a4d"/>
<text x="518" y="264" text-anchor="middle" fill="#111">0</text>
<text x="486" y="288" text-anchor="middle" font-weight="bold" fill="#111">postgres, no recovery</text>
<rect x="604" y="270" width="56" height="1" fill="#c0392b"/>
<text x="632" y="264" text-anchor="middle" fill="#111">0</text>
<rect x="668" y="50" width="56" height="220" fill="#1f7a4d"/>
<text x="696" y="44" text-anchor="middle" fill="#111">1</text>
<text x="664" y="288" text-anchor="middle" font-weight="bold" fill="#111">postgres, with recovery</text>
<rect x="60" y="300" width="12" height="12" fill="#c0392b"/>
<text x="78" y="310" fill="#111">stuck as running</text>
<rect x="60" y="318" width="12" height="12" fill="#1f7a4d"/>
<text x="78" y="328" fill="#111">marked failed, can be retried</text>
</svg>