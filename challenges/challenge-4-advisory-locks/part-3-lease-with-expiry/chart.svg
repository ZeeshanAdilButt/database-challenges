<svg xmlns="http://www.w3.org/2000/svg" width="1264" height="218" viewBox="0 0 1264 218" font-family="Arial, sans-serif" font-size="12">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="12" y="26" font-size="16" font-weight="bold" fill="#111">A lease runs out, B takes over, late A is fenced out</text>
<line x1="110" y1="82" x2="1254" y2="82" stroke="#ccc"/>
<text x="12" y="86" font-weight="bold" fill="#111">Watcher A</text>
<line x1="110" y1="146" x2="1254" y2="146" stroke="#ccc"/>
<text x="12" y="150" font-weight="bold" fill="#111">Watcher B</text>
<rect x="110" y="58" width="150" height="48" rx="6" fill="#34495e"/>
<text x="118" y="76" fill="#fff">0 ms: takes the lease</text>
<text x="118" y="90" fill="#fff">on task 1 until 1500</text>
<text x="118" y="104" fill="#fff">ms</text>
<text x="185" y="204" text-anchor="middle" fill="#555">1</text>
<rect x="272" y="58" width="150" height="48" rx="6" fill="#34495e"/>
<text x="280" y="76" fill="#fff">500 ms: renews</text>
<text x="347" y="204" text-anchor="middle" fill="#555">2</text>
<rect x="434" y="58" width="150" height="48" rx="6" fill="#34495e"/>
<text x="442" y="76" fill="#fff">600 ms: stops renewing</text>
<text x="442" y="90" fill="#fff">(killed, or paused)</text>
<text x="509" y="204" text-anchor="middle" fill="#555">3</text>
<rect x="596" y="122" width="150" height="48" rx="6" fill="#b9770e"/>
<text x="604" y="140" fill="#fff">1000 ms: tries to take</text>
<text x="604" y="154" fill="#fff">task 1</text>
<text x="671" y="204" text-anchor="middle" fill="#555">4</text>
<rect x="758" y="122" width="150" height="48" rx="6" fill="#1f7a4d"/>
<text x="766" y="140" fill="#fff">2100 ms: tries again</text>
<text x="766" y="154" fill="#fff">after the lease ran</text>
<text x="766" y="168" fill="#fff">out</text>
<text x="833" y="204" text-anchor="middle" fill="#555">5</text>
<rect x="920" y="58" width="150" height="48" rx="6" fill="#1f7a4d"/>
<text x="928" y="76" fill="#fff">2300 ms: wakes up,</text>
<text x="928" y="90" fill="#fff">finishes with token 1</text>
<text x="995" y="204" text-anchor="middle" fill="#555">6</text>
<rect x="1082" y="122" width="150" height="48" rx="6" fill="#34495e"/>
<text x="1090" y="140" fill="#fff">2600 ms: finishes with</text>
<text x="1090" y="154" fill="#fff">token 2</text>
<text x="1157" y="204" text-anchor="middle" fill="#555">7</text>
<text x="12" y="204" fill="#555">step</text>
</svg>