# PostgreSQL and MySQL for the challenges. SQLite needs nothing: it is built into Node.js.
# Ports 5440 and 5441 on your machine, so they do not clash with a PostgreSQL on
# 5432 or a MySQL on 3306.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: challenge
      POSTGRES_PASSWORD: challenge
      POSTGRES_DB: challenges
    ports:
      - "5440:5432"
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: challenge
      MYSQL_DATABASE: challenges
      MYSQL_USER: challenge
      MYSQL_PASSWORD: challenge
    ports:
      - "5441:3306"
